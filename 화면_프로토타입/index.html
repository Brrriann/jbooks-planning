    }
    .lg\:border-b-0 {
      border-bottom-style: var(--tw-border-style);
      border-bottom-width: 0px;
    }
    .lg\:px-5 {
      padding-inline: calc(var(--spacing) * 5);
    }
    .lg\:py-9 {
      padding-block: calc(var(--spacing) * 9);
    }
  }
  @media (width >= 80rem) {
    .xl\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .xl\:grid-cols-\[minmax\(0\,1\.1fr\)_minmax\(0\,1fr\)\] {
      grid-template-columns: minmax(0,1.1fr) minmax(0,1fr);
    }
    .xl\:grid-cols-\[minmax\(0\,1\.2fr\)_minmax\(0\,1fr\)\] {
      grid-template-columns: minmax(0,1.2fr) minmax(0,1fr);
    }
    .xl\:grid-cols-\[minmax\(0\,1\.5fr\)_minmax\(0\,1fr\)\] {
      grid-template-columns: minmax(0,1.5fr) minmax(0,1fr);
    }
  }
}
@media (max-width:900px) {
  .sidebar>div:first-child {
    padding: 20px 24px;
  }
  .sidebar>div:last-child {
    margin-top: 0;
    padding: 6px 24px 18px;
    gap: 14px;
  }
  .sidebar nav button {
    font-size: 11px;
    min-height: 62px;
  }
  .sidebar nav button>span {
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .sidebar nav {
    padding: 0 12px 12px;
  }
}
@layer base {
  body {
    margin: 0;
    background: #fafbf6;
    color: var(--color-ink);
    font-family: var(--font-sans);
  }
  button,a,input,select,textarea {
    -webkit-tap-highlight-color: transparent;
  }
  button:not(:disabled),a {
    cursor: pointer;
  }
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
    outline: 2px solid var(--color-forest);
    outline-offset: 3px;
  }
  input[type="checkbox"] {
    accent-color: var(--color-forest);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  p,td,dd {
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  input:disabled {
    background: var(--color-soft);
  }
  ::selection {
    background: var(--color-lime);
    color: var(--color-forest-dark);
  }
}
@layer components {
  .app-shell {
    display: grid;
    grid-template-columns: 218px minmax(0,1fr);
    min-height: 100dvh;
  }
  .sidebar {
    background: #1d352b;
    position: sticky;
    top: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--color-line);
  }
  .section-title h2 {
    font-weight: 600;
    font-size: 15px;
  }
  .section-title>span {
    font-size: 11px;
    color: var(--color-muted);
  }
  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    max-width: min(480px,calc(100vw - 32px));
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    color: white;
    background: var(--color-forest-dark);
    border: 1px solid #557157;
    box-shadow: 0 10px 30px #17382b24;
    font-size: 12px;
    line-height: 1.8;
    z-index: 5;
    border-radius: 8px;
    animation: toast-in .18s ease-out;
  }
  @media (max-width:900px) {
    .app-shell {
      grid-template-columns: 1fr;
    }
    .sidebar {
      height: auto;
      position: static;
      overflow: visible;
    }
    .sidebar>div:first-child {
      padding: 20px 24px;
    }
    .sidebar>div:first-child>p:last-child {
      font-size: 17px;
      margin-top: 6px;
    }
    .sidebar>div:first-child>p:last-child>span {
      display: none;
    }
    .sidebar nav {
      grid-template-columns: repeat(5,minmax(0,1fr));
      padding: 0 16px 16px;
    }
    .sidebar nav button {
      flex-direction: column;
      gap: 7px;
      padding: 12px 3px;
      font-size: 11px;
    }
    .sidebar nav button>span:last-child {
      display: none;
    }
    .sidebar>div:last-child {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 0 24px 18px;
    }
    .sidebar>div:last-child>p {
      display: none;
    }
    .sidebar>div:last-child>a {
      margin: 0;
    }
  }
  @media (max-width:480px) {
    .sidebar nav {
      padding-left: 10px;
      padding-right: 10px;
    }
    .sidebar>div:last-child {
      gap: 12px;
    }
    .toast {
      right: 16px;
      bottom: 16px;
    }
    input,select,textarea {
      font-size: 16px !important;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after {
      animation: none !important;
      transition: none !important;
    }
  }
  @keyframes toast-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
}
